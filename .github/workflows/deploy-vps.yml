name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS secrets
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=VPS deploy skipped::Add repository secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (see README)."
          fi

      - name: Deploy to VPS
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/gym-log}"
            cd "$APP_DIR"
            bash deploy/update-vps.sh

      - name: Verify public endpoint
        if: steps.cfg.outputs.ready == 'true'
        run: |
          host="${{ secrets.VPS_HOST }}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "http://${host}/gym-log/" || true)"
          echo "http://${host}/gym-log/ → HTTP ${code:-?}"
