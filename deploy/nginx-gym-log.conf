# Добавь в тот же server {} (listen 80 / 443), где уже IndieRadar и другие сайты.
# Docker: gym-log на 127.0.0.1:8787 с APP_BASE=/gym-log и VITE_BASE=/gym-log/
#
# Итог: http://128.140.50.104/gym-log/  (и https://…/gym-log/ если есть TLS)

location = /gym-log {
  return 302 /gym-log/;
}

location /gym-log/ {
  proxy_pass http://127.0.0.1:8787;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
