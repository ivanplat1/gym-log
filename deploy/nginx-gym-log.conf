# Фрагмент для nginx на VPS 128.140.50.104
# IndieRadar остаётся на / ; gym-log — на порту 8787 (Docker) и опционально снаружи.
#
# Вариант A (проще): открыть порт в firewall
#   ufw allow 8787/tcp
#   → http://128.140.50.104:8787
#
# Вариант B: проксировать с :80 на Docker (раскомментируй location ниже
# в том же server {}, где сейчас IndieRadar):

# location /gym-log/ {
#   proxy_pass http://127.0.0.1:8787/;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
# }
#
# Важно: при варианте B пересобери образ с VITE_BASE=/gym-log/
#   docker compose build --build-arg VITE_BASE=/gym-log/
# и в docker-compose не публикуй наружу 8787 (оставь только localhost).

server {
  listen 8787;
  server_name 128.140.50.104;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
