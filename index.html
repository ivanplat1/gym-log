<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1812" />
    <meta name="theme-color" content="#1c1812" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: контент/фон html под status bar; нужен reinstall PWA если кэш старый -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymLog" />
    <meta name="description" content="GymLog — трекер тренировок и питания" />
    <style>
      html,
      body {
        background-color: #1c1812;
        margin: 0;
        overflow: hidden;
      }
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: auto;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>GymLog</title>
  </head>
  <body>
    <div class="app-atmosphere" aria-hidden="true"></div>
    <div id="root"></div>
    <div id="layout-debug" aria-hidden="true">
      <div class="layout-debug-legend">
        <b>DEBUG LAYOUT</b>
        <span class="dbg-note">тёмно-фиол. под safe-b = html gap</span>
        <div><i class="dbg-swatch dbg-html"></i> html</div>
        <div><i class="dbg-swatch dbg-body"></i> body</div>
        <div><i class="dbg-swatch dbg-atm"></i> atmosphere</div>
        <div><i class="dbg-swatch dbg-root"></i> #root</div>
        <div><i class="dbg-swatch dbg-shell"></i> app-shell (scroll)</div>
        <div><i class="dbg-swatch dbg-main"></i> app-main</div>
        <div><i class="dbg-swatch dbg-dock"></i> dock</div>
        <div><i class="dbg-swatch dbg-safe-t"></i> safe-top</div>
        <div><i class="dbg-swatch dbg-safe-b"></i> safe-bottom</div>
        <pre id="layout-debug-metrics"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
