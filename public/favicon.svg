<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="gym-log">
  <defs>
    <linearGradient id="bg" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="tile" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="42%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#b56f00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="50%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#d49210"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- activity ring -->
  <circle cx="256" cy="242" r="172" fill="none" stroke="#1f1f1f" stroke-width="24"/>
  <path
    d="M256 70 A172 172 0 1 1 110 334"
    fill="none"
    stroke="#3dd68c"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- brand tile + G -->
  <g filter="url(#soft)">
    <rect x="152" y="138" width="208" height="208" rx="48" fill="url(#tile)"/>
    <text
      x="256"
      y="288"
      text-anchor="middle"
      font-family="Inter, DejaVu Sans, Arial Black, sans-serif"
      font-size="158"
      font-weight="800"
      fill="#0a0a0a"
    >G</text>
  </g>

  <!-- barbell -->
  <g fill="url(#steel)">
    <rect x="170" y="408" width="172" height="14" rx="7"/>
    <rect x="134" y="394" width="26" height="42" rx="8"/>
    <rect x="112" y="402" width="16" height="26" rx="5"/>
    <rect x="352" y="394" width="26" height="42" rx="8"/>
    <rect x="384" y="402" width="16" height="26" rx="5"/>
  </g>
</svg>
